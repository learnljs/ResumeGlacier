# ResumeGlacier 一键启动
#
#   cp .env.example .env        # 填好 ENCRYPTION_KEY（openssl rand -hex 32）
#   docker compose up -d --build
#   open http://localhost:3000  # 空库首次打开会自动写入演示数据
#
# 数据落在宿主机 ./data 下，删容器不影响简历与附件。

name: resume-glacier

services:
  app:
    build:
      context: .
    image: resume-glacier:latest
    container_name: resume-glacier
    restart: unless-stopped
    ports:
      - '${APP_PORT:-3000}:3000'
    environment:
      # prisma 的相对路径以 schema 所在目录（/app/prisma）为基准，因此落在 /app/prisma/data
      DATABASE_URL: file:./data/resume.db
      # 32 字节十六进制密钥，用于加密邮箱密码；缺省时 compose 会直接报错退出
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?请在 .env 中设置 ENCRYPTION_KEY（openssl rand -hex 32）}
      # 定时收取接口的鉴权串，按需设置；不设置则 /api/cron/* 一律 401（fail-closed）
      CRON_SECRET: ${CRON_SECRET:-}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data/db:/app/prisma/data
      - ./data/uploads:/app/data/uploads
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
