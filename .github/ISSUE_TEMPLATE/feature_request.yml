name: 功能建议
description: 提出新功能或对现有流程的改进
title: '[Feature] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        提建议前请先确认 README 的「核心特性」里没有已经支持的能力。
        这个项目偏向「小而完整」，能通过 Webhook / 提示词配置解决的通常不会再进核心。

  - type: textarea
    id: problem
    attributes:
      label: 想解决的场景
      description: 你在什么情况下觉得不便？现在是怎样绕过去的？
      placeholder: 同时跟进 3 个职位时，只能一个个切换职位筛选，看不到跨职位的候选人总量。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望界面上出现什么、怎么操作？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 有没有试过用配置、导出、Webhook 等方式先凑合？为什么不够用？

  - type: dropdown
    id: module
    attributes:
      label: 影响模块
      options:
        - 邮件收取（IMAP）
        - 文本提取（PDF / DOCX / OCR）
        - AI 筛选与评分
        - 简历列表 / 详情
        - 跟进管理
        - 系统配置
        - 任务管理
        - 导出 / 集成
        - 运行 / 数据
        - 其他
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意自己提 PR 实现这个功能
        - label: 我可以提供测试数据或帮忙验证效果
